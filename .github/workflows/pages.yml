# Veröffentlicht das Spiel (Ordner public/) bei jedem Push auf main auf GitHub Pages:
# https://n-brand.github.io/StrategieSpiel/
# Vorher laufen die Tests – schlagen sie fehl, bleibt die alte Version online.
# Einmalig nötig: GitHub → Settings → Pages → Source „GitHub Actions“.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
